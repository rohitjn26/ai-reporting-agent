[pytest]
# `agent` is on the import path so agent modules resolve the same way they do at
# runtime (e.g. `from chart.renderer import render_chart`). The repo root is
# deliberately NOT added — the local `mcp/` directory would otherwise shadow the
# installed `mcp` SDK. Modules under `mcp/` and `library/` are loaded by file path
# in conftest.py instead.
pythonpath = agent
testpaths = tests
asyncio_mode = auto
markers =
    e2e: end-to-end test that spins up a disposable Postgres via Docker (skips if unavailable)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
